name: Daily Task

on:
  schedule:
    # 每天 UTC 时间 0:00 执行 (北京时间 8:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  daily-task:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run daily script (TypeScript)
        run: npm run daily
        env:
          # 在这里添加需要的环境变量
          # EXAMPLE_VAR: ${{ secrets.EXAMPLE_VAR }}
